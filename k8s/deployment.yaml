# CloudSentinel REST API: one pod writing to one SQLite file on a PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudsentinel
  labels:
    app: cloudsentinel
spec:
  replicas: 1
  # SQLite on a ReadWriteOnce volume supports one writer: stop the old pod
  # before starting a new one instead of overlapping them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloudsentinel
  template:
    metadata:
      labels:
        app: cloudsentinel
    spec:
      # Same non-root user as the Dockerfile (useradd --uid 10001 appuser).
      # Numeric IDs are required for Kubernetes to verify runAsNonRoot.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: cloudsentinel
          image: cloudsentinel:latest
          # Locally built image: don't try to pull ":latest" from a registry
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CLOUDSENTINEL_DB_PATH
              value: /app/data/cloudsentinel.db
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cloudsentinel-data
